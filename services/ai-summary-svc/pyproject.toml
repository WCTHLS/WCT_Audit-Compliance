[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wct-ai-summary-svc"
version = "0.1.0"
description = "AI Clinical Summary and Risk Explanation Service for WCT Module 5"
readme = "README.md"
authors = [{ name = "WCT Engineering Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "wct-event-contracts",
    "wct-evidence-lookup",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "prompts*"]
