[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wct-auth-middleware"
version = "0.1.0"
description = "Stub JWT authentication and RBAC middleware for WCT Module 5"
readme = "README.md"
authors = [{ name = "WCT Engineering Team" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyjwt>=2.8.0",
    "fastapi>=0.100.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["auth_middleware*"]
