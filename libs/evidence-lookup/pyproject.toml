[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wct-evidence-lookup"
version = "0.1.0"
description = "Shared Evidence Lookup Client for resolving case evidence pointers to clinical, risk, and peer fixtures"
readme = "README.md"
authors = [{ name = "WCT Engineering Team" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "wct-event-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["evidence_lookup*"]
